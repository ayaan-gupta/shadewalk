<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="A walker follows a line of teal shade down a sunlit street at sunset">
  <!-- Interim art, drawn by hand in code. Replaced by assets/generated/landing/hero.png when delivered. -->
  <rect width="1200" height="720" fill="#F6C56B"/>
  <rect y="0" width="1200" height="150" fill="#5B3A5E"/>
  <rect y="150" width="1200" height="90" fill="#C44D58"/>
  <rect y="240" width="1200" height="80" fill="#EB6B4F"/>
  <rect y="320" width="1200" height="70" fill="#F2994A"/>
  <circle cx="930" cy="330" r="118" fill="#FBE3A8"/>
  <circle cx="930" cy="330" r="86" fill="#FFF3D1"/>
  <!-- far skyline -->
  <g fill="#C44D58">
    <rect x="0" y="250" width="90" height="200"/><rect x="100" y="210" width="60" height="240"/>
    <rect x="170" y="270" width="110" height="180"/><rect x="560" y="230" width="70" height="220"/>
    <rect x="640" y="280" width="120" height="170"/><rect x="1080" y="240" width="120" height="210"/>
  </g>
  <!-- near towers -->
  <g fill="#5B3A5E">
    <rect x="40" y="170" width="120" height="290"/><rect x="70" y="130" width="60" height="50"/>
    <rect x="250" y="120" width="150" height="340"/><polygon points="250,120 325,70 400,120"/>
    <rect x="430" y="220" width="110" height="240"/>
    <rect x="700" y="190" width="100" height="270"/><rect x="738" y="140" width="24" height="60"/>
    <rect x="1010" y="160" width="130" height="300"/>
  </g>
  <g fill="#F6C56B">
    <rect x="270" y="150" width="14" height="22"/><rect x="300" y="150" width="14" height="22"/><rect x="330" y="150" width="14" height="22"/><rect x="360" y="150" width="14" height="22"/>
    <rect x="270" y="200" width="14" height="22"/><rect x="330" y="200" width="14" height="22"/><rect x="360" y="250" width="14" height="22"/>
    <rect x="60" y="200" width="14" height="22"/><rect x="120" y="250" width="14" height="22"/><rect x="1030" y="190" width="14" height="22"/><rect x="1090" y="240" width="14" height="22"/>
    <rect x="450" y="250" width="14" height="22"/><rect x="505" y="300" width="14" height="22"/><rect x="720" y="230" width="14" height="22"/><rect x="765" y="290" width="14" height="22"/>
  </g>
  <!-- ground -->
  <rect y="450" width="1200" height="270" fill="#FBEBD3"/>
  <polygon points="0,520 1200,470 1200,560 0,650" fill="#F3D9B1"/>
  <!-- shadows thrown toward the viewer, away from the low sun on the right -->
  <g fill="#1B7F8A">
    <polygon points="40,460 160,460 60,720 -160,720"/>
    <polygon points="250,460 400,460 330,720 60,720"/>
    <polygon points="430,460 540,460 500,640 350,640"/>
    <polygon points="700,460 800,460 760,620 640,620"/>
    <polygon points="1010,460 1140,460 1090,700 930,700"/>
  </g>
  <g fill="#0E5C68">
    <ellipse cx="596" cy="560" rx="70" ry="20"/><ellipse cx="872" cy="548" rx="64" ry="18"/>
  </g>
  <!-- trees -->
  <g>
    <rect x="610" y="470" width="12" height="80" fill="#5B3A5E"/><circle cx="616" cy="440" r="52" fill="#1B7F8A"/><circle cx="640" cy="420" r="34" fill="#7FC4C1"/>
    <rect x="888" y="476" width="10" height="66" fill="#5B3A5E"/><circle cx="893" cy="452" r="44" fill="#1B7F8A"/><circle cx="912" cy="436" r="28" fill="#7FC4C1"/>
  </g>
  <!-- the route: dotted through sun, solid through shade -->
  <path d="M 1150 610 C 1040 640, 960 600, 880 590 S 700 640, 600 610" fill="none" stroke="#EB6B4F" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>
  <path d="M 600 610 C 520 590, 420 660, 300 650 S 150 600, 60 640" fill="none" stroke="#FBF7F0" stroke-width="9" stroke-linecap="round"/>
  <!-- walker with umbrella-free stride -->
  <g transform="translate(418 566)">
    <ellipse cx="6" cy="92" rx="34" ry="8" fill="#0E5C68"/>
    <circle cx="0" cy="0" r="13" fill="#F2994A"/>
    <path d="M -9 16 h 18 l 6 40 h -30 z" fill="#C44D58"/>
    <path d="M -6 56 l -10 34 M 8 56 l 12 34" stroke="#2B2A33" stroke-width="8" stroke-linecap="round"/>
    <path d="M -10 24 l -16 22 M 10 24 l 14 20" stroke="#C44D58" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="1150" cy="610" r="13" fill="#EB6B4F" stroke="#FBF7F0" stroke-width="5"/>
  <circle cx="60" cy="640" r="13" fill="#0E5C68" stroke="#FBF7F0" stroke-width="5"/>
</svg>
